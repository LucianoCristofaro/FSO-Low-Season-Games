<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeopardy · FSO Games</title>
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../../index.html">FSO <span>Games</span></a>
    <a class="btn btn-ghost" href="../../index.html">← Volver al menú</a>
  </header>

  <main class="container">
    <div class="game-header">
      <h1 class="game-title">Jeopardy <span>Corporativo</span></h1>
      <div class="scoreboard" aria-live="polite">
        <span class="scoreboard-label">Marcador</span>
        <span class="score" id="score">0</span>
      </div>
    </div>

    <section class="board" id="board" aria-label="Tablero de Jeopardy"></section>

    <div class="board-footer">
      <button class="btn" id="restart-btn">Reiniciar partida</button>
    </div>
  </main>

  <!-- Modal de pregunta -->
  <div class="modal" id="question-modal" role="dialog" aria-modal="true" aria-labelledby="q-text">
    <div class="modal-card">
      <div class="modal-meta">
        <span class="modal-category" id="q-category"></span>
        <span class="modal-value" id="q-value"></span>
      </div>
      <p class="modal-question" id="q-text"></p>
      <div class="options" id="q-options"></div>
      <p class="feedback neutral" id="q-feedback" aria-live="polite"></p>
      <div class="modal-actions">
        <button class="btn" id="reveal-btn">Revelar respuesta</button>
        <button class="btn btn-primary" id="close-btn">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal de fin de juego -->
  <div class="modal end-overlay" id="end-modal" role="dialog" aria-modal="true" aria-labelledby="end-title">
    <div class="modal-card">
      <h2 id="end-title">¡Partida terminada!</h2>
      <p>Puntuación final</p>
      <div class="final-score" id="final-score">0</div>
      <div class="modal-actions" style="justify-content:center">
        <button class="btn btn-primary" id="play-again-btn">Jugar de nuevo</button>
        <a class="btn" href="../../index.html">Menú principal</a>
      </div>
    </div>
  </div>

  <script src="jeopardy.js"></script>
</body>
</html>
